<div>
    <label for="tel">Tel:</label>
    <input type="tel" id="tel" name="tel">
  </div>
  </hr>
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
  </div>
  </hr>
  <div>
    <label for="date">Date:</label>
    <input type="date" id="date" name="date">
  </div>
  </hr>
  <div>
    <label for="password">Mot de passe:</label>
    <input type="password" id="password" name="password">
  </div>
  </hr>
  <div>
    <label for="valeur">Valeur:</label>
    <input type="number" id="valeur" name="valeur">
  </div>
  <div>
    <label for="commentaire">Mon commentaire:</label><br>
    <textarea id="commentaire" name="commentaire" rows="5" cols="40"></textarea>
  </div>
  <div>
    <label>Genre:</label><br>
    <input type="radio" id="homme" name="genre" value="homme">
    <label for="homme">Homme</label><br>
    <input type="radio" id="femme" name="genre" value="femme">
    <label for="femme">Femme</label>
  </div>
  <div>
    <label>Mobilité:</label><br>
    <input type="checkbox" id="voiture" name="mobilite" value="voiture">
    <label for="voiture">Voiture</label><br>
    <input type="checkbox" id="velo" name="mobilite" value="velo">
    <label for="velo">Vélo</label><br>
    <input type="checkbox" id="transport" name="mobilite" value="transport">
    <label for="transport">Transport en commun</label>
  </div>
  <div>
    <label for="pays">Pays:</label>
    <select id="pays" name="pays">
      <option value="dz">Algérie</option>
      <option value="fr">France</option>
      <option value="ca">Canada</option>
    </select>
  </div>
  <div>
    <label for="fruits">Fruits (choix multiples):</label>
    <select id="fruits" name="fruits" multiple>
      <option value="pomme">Pomme</option>
      <option value="banane">Banane</option>
      <option value="kiwi">Kiwi</option>
    </select>
  </div>
  <fieldset>
    <legend>Informations personnelles</legend>
    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom"><br>
    <label for="prenom">Prénom:</label>
    <input type="text" id="prenom" name="prenom">
  </fieldset>
